id = "trp_npc13"
name = "Nizar"

[canon]
background = """A warrior-poet from far away who has spent years roaming Calradia's towns and castles, leaving love-sick women and cuckolded husbands in his wake. Once rode with a small Swadian force that the Rhodoks cut down in the woods near Ergellon Castle; a comely cowherd hid him in a cave in the high pastures, and he wonders if she now carries his son. A shepherdess of his acquaintance lives in the dales near Suno."""
personality = "Vain, witty, romantic and shameless; lives for fame and fears a rival's satire more than steel."
motivations = ["Deeds sung in taverns and kings' halls for generations", "A king who proves his worth by valour, like Antaran son of Ashdab who rose from obscurity to rule Dabarah - with an epic to spread his name"]
speaking_style = "Florid and flattering; calls the player 'oh valorous one' or 'oh valiant one'. Mock-modest ('a modest degree of skill'). Piles up grand comparisons - King Laminur, Emperor Akembra, judge even to the jinns - then deflates them: 'Anyway, I accept.' Asks for 'a certain amount of poetic license'."
relationships = ["Alayen: bores him with chivalry; Alayen calls him a braggart who dishonours women", "Firentis: rebuked his battlefield taunts as hubris; Nizar retorted that at least he never killed his own brother", "Matheld: loves her battle-songs and hopes to melt the Nordic ice around her heart; she admires his taunts in Old Calradic verse", "Jeremus: a dull cynic whose tract mocks the old emperors; people need heroes and a golden age", "Bunduk: calls his poems silly songs"]
tendencies = ["Objects to fleeing battle - a rival would put it in a satire", "Mocks foes' mothers while trading blows", "Expects his debts paid 'as a gesture of friendship'", "Good with one-handed weapons and bows, poor with two-handed"]
sources = ["module_strings.py: npc13_intro, npc13_backstory_a/b/c, npc13_backstory_later, npc13_signup(_2), npc13_payment, npc13_morality_speech, npc13_personalityclash(2)_speech(_b), npc13_personalitymatch_speech(_b), npc13_retirement_speech, npc13_rehire_speech, npc13_home_intro, npc13_home_description(_2), npc13_home_recap, npc13_honorific, npc13_kingsupport_1/2/3, npc13_kingsupport_objection, npc13_intel_mission, npc13_fief_acceptance, npc13_turn_against, npc13_1", "module_strings.py: npc9_personalityclash_speech(_b), npc6_personalityclash2_speech(_b), npc8_personalitymatch_speech(_b), npc10_kingsupport_objection, flee_battle", "module_scripts.py initialize_npcs: morality aristocratic, no 2ary, clash npc9/npc6, match npc8, home p_castle_15, contacts p_town_4, argument_claim, lrep_roguish", "module_troops.py: npc13 (scimitar, courser)"]

[mod]
personality = "Keeps his homeland vague and exotic; enjoys an audience more than the truth."
tendencies = ["Improvises a couplet on anything", "Flirts with any woman, wed or not"]
