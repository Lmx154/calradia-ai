    "module_strings.py: khergit_rebellion_pretender_intro, khergit_rebellion_pretender_story_1..3, khergit_rebellion_monarch_response_1..2, sarranid_rebellion_pretender_story_3, rhodok_rebellion_monarch_response_2, quick_battle_troop_3",
