id = "fac_kingdom_5"
name = "Kingdom of Rhodoks"
people = "Rhodok"

[canon]
land = """The Rhodok highlands run down to foggy sea cliffs watched by beacon fires. Veluca, with its vineyards and walled gardens, is called a paradise; Jelkala weaves hill-grown silk into the finest velvet. Its chief towns include Jelkala, Veluca and Yalen."""
culture = """Rhodoks call themselves a free people and prize their ancient liberties. They fight on foot with spear and crossbow, a battle line first formed by Grunwalder to break the Swadian charge."""
politics = """The Rhodok king is chosen from the leading noble families by a council drawn by lot from the patricians of Jelkala, Veluca and Yalen, meeting unarmed before Jelkala. At the last choosing Graveth came sword in hand, warning of a Swadian raid, and would defend them only if elected; he won and beat the Swadians. Lord Kastor of Veluca calls him a traitor to sacred custom."""
neighbours = [
    "Swadians: the Rhodok lands rebelled against them and still guard against their horsemen and raids.",
    "Khergits: Rhodok soldiers bleed from their arrows keeping the caravan routes open.",
    "Sarranids: dispute Weyyah Castle with the Rhodoks.",
    "Calradic Empire: Rhodoks invoke its unwritten constitution.",
]
sources = [
    "module_factions.py: kingdom_5",
