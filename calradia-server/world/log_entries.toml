# One entry per Native log entry type (module_constants.py logent_*).
# Placeholders: {actor} {center} {troop} {faction} {center_lord} {center_faction} {troop_faction}.
# A placeholder is a troop, party or faction index sent by the game; the server names it.
# {actor}/{troop}/{center_lord} name troops (trp_player is the player); {center} a party; the
# {*faction} ones a faction.
# Exceptions found in Native 1.171 (see each note):
# - types 90-94: {actor} holds a FACTION index (the declaring realm), not a troop: actor = "faction".
# - type 3 is also logged for travellers attacked (center set): only_if_unset = ["center"].
# - center_lord is negative (stl_unassigned = -1 etc.) for a center without a lord; treat < 0 as none.
# - a field passed as 0 reads as trp_player / p_main_party, so 0-valued fields are never used below.
# - Native can also log an unset war type (0 in practice) when a war reason matches none of 90-94.

[[entry]]
type = 1
name = "logent_village_raided"
text = "{actor} raided the village of {center}."
involves = ["actor", "center_lord"]
realms = ["center_faction"]
importance = 2
skip = false
note = "module_scripts.py process_village_raids (raid completed; actor = leader of the looting party, a lord or trp_player; faction -1) and diplomacy_party_attacks_neutral (player starts attacking/plundering a village; actor trp_player; faction = village realm). One player raid can log 2-3 entries. center = the village."

