# Legacy TaleWorlds sources: only check for syntax errors and undefined names.
# Formatting is intentionally not applied (keeps the port diff reviewable).
extend = "../pyproject.toml"
# module_strings.py is cp1254-encoded (raw 0x96/0x97 bytes); ruff only reads UTF-8.
extend-exclude = ["module_system/module_strings.py"]

[lint]
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# reg() deliberately calls the undefined name cause_error() to abort on a negative register.
"module_system/header_common.py" = ["F821"]

[format]
exclude = ["**"]
